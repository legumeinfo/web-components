<!doctype html>

<html>
  <head>
    <meta charset="utf-8" />
    <title>
      LIS Web-Components - &lt;lis-retrieve-one-gene-sequence-element&gt;
    </title>
    <!-- CSS framework -->
    <link
      rel="stylesheet"
      type="text/css"
      href="../node_modules/uikit/dist/css/uikit.min.css"
    />
    <script src="../node_modules/uikit/dist/js/uikit.min.js"></script>
    <!-- web components polyfills -->
    <script src="../node_modules/@webcomponents/webcomponentsjs/webcomponents-loader.js"></script>
    <script src="../node_modules/lit/polyfill-support.js"></script>
    <!-- web components -->
    <script type="module" src="../lib/index.js"></script>
  </head>

  <body>
    <div class="uk-container">
      <h1>&lt;lis-retrieve-one-gene-sequence-element&gt;</h1>

      <lis-retrieve-one-gene-sequence-element
        id="retrieve"
      ></lis-retrieve-one-gene-sequence-element>
    </div>

    <script type="text/javascript">
      // Point the backend URL at the same host the page was loaded from so
      // a remote browser hits the dev box's `sequences` service instead of its
      // own localhost. Overridable per environment if needed.
      const retrieveElement = document.getElementById('retrieve');
      const host = window.location.hostname || 'localhost';
      retrieveElement.sequencesBase = `http://${host}:8082`;

      // Uncomment to fire an automatic search on page load — handy when
      // smoke-testing the backend without clicking through the form.

      //   retrieveElement.retrieve({
      //     geneId: 'cicar.CDCFrontier.gnm2.ann1.Ca_00001',
      //     protein: true,
      //     cds: true,
      //     genome: false,
      //   });
      // };
    </script>
  </body>
</html>
