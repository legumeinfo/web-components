<!doctype html>

<html>
  <head>
    <meta charset="utf-8" />
    <title>LIS Web-Components - &lt;lis-retrieve-sequence-element&gt;</title>
    <!-- CSS framework -->
    <link
      rel="stylesheet"
      type="text/css"
      href="../node_modules/uikit/dist/css/uikit.min.css"
    />
    <script src="../node_modules/uikit/dist/js/uikit.min.js"></script>
    <!-- web components polyfills -->
    <script src="../node_modules/@webcomponents/webcomponentsjs/webcomponents-loader.js"></script>
    <script src="../node_modules/lit/polyfill-support.js"></script>
    <!-- web components -->
    <script type="module" src="../lib/index.js"></script>
  </head>

  <body>
    <div class="uk-container">
      <h1>&lt;lis-retrieve-sequence-element&gt;</h1>

      <lis-retrieve-sequence-element
        id="retrieve"
      ></lis-retrieve-sequence-element>
    </div>

    <script type="text/javascript">
      // Target the GraphQL server on the page's own host (so a remote browser
      // hits the dev box, not its own localhost).
      const retrieveElement = document.getElementById('retrieve');
      const host = window.location.hostname || 'localhost';
      retrieveElement.graphqlEndpoint = `http://${host}:4000/graphql`;
    </script>
  </body>
</html>
